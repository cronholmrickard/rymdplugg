name: Håll taligenkänningen vaken

# Gratis Spaces somnar efter 48 timmar utan trafik. Ett anrop var sjätte timme håller den igång.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 5 --retry-delay 30 --max-time 120 https://klangrickard-rymdplugg-asr.hf.space/ || true
